plugins { id 'java' }

group = 'com.vit'
version = '1.0.0'

repositories { mavenCentral() }

tasks.withType(JavaCompile).configureEach { options.release = 21 }

// The demo test is a plain main() class, so disable the JUnit-based task
// (Gradle 9 fails when it finds no discovered tests) and run our own.
tasks.named('test') { enabled = false }

tasks.register('newsflowTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vit.newsflow.NewsWorkflowTest'
}
tasks.named('check') { dependsOn tasks.named('newsflowTest') }

tasks.named('jar') {
    archiveBaseName = 'newsflow-ci-demo'
    manifest { attributes 'Main-Class': 'com.vit.newsflow.App' }
}
